<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選一條路線｜撞球與健身</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:#101214;color:#f4ecd8;min-height:100vh;display:grid;grid-template-rows:auto 1fr}
h1,h2{font-family:"Noto Serif TC",serif}
.title{text-align:center;padding:28px 16px 20px}
.title h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900}
.title p{color:#b8bec6;margin-top:4px}

.split{display:grid;grid-template-columns:1fr 1fr}
.panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:48px 24px;
  text-align:center;color:inherit;text-decoration:none;transition:filter .25s,transform .25s}
.panel:hover,.panel:focus-visible{filter:brightness(1.12)}
.panel:focus-visible{outline:3px solid #fff;outline-offset:-8px}
.panel h2{font-size:clamp(2rem,5vw,3rem);font-weight:900}
.panel p{max-width:20em;opacity:.85}
.cta{margin-top:6px;padding:10px 26px;border-radius:999px;font-weight:500}

.pool{background:#0e4636;box-shadow:inset 0 0 0 12px #3a2316}
.pool .cta{background:#d2a94b;color:#2a1a0c}
.fit{background:#1b2027;box-shadow:inset 0 0 0 12px #14171c}
.fit .cta{background:#ff7a3d;color:#1b0e06}

/* 8 號球 */
.ball{width:130px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:0 12px 20px #0007;
  background:radial-gradient(circle at 32% 28%,#fff6 0,#fff0 38%),#151515}
.ball b{width:46%;aspect-ratio:1;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:900 1.6rem "Noto Serif TC",serif}

/* 啞鈴 */
.bell{display:flex;align-items:center;height:130px}
.bell i{display:block;background:#ff7a3d;border-radius:4px}
.bell .p1{width:18px;height:96px}.bell .p2{width:16px;height:70px;margin-left:4px;opacity:.85}
.bell .bar{width:72px;height:12px;background:#c9ced6;margin:0 4px;border-radius:2px}
.bell .p3{width:16px;height:70px;margin-right:4px;opacity:.85}.bell .p4{width:18px;height:96px}

@media(max-width:760px){.split{grid-template-columns:1fr}.panel{padding:40px 24px}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<header class="title">
  <h1>你今天想看什麼？</h1>
  <p>選一條路線開始</p>
</header>

<main class="split">
  <a class="panel pool" href="billiards.html">
    <div class="ball" role="img" aria-label="8 號球"><b>8</b></div>
    <h2>撞球</h2>
    <p>八號球、九號球規則，以及柯秉中的比賽影片。</p>
    <span class="cta">進入撞球 →</span>
  </a>

  <a class="panel fit" href="fitness.html">
    <div class="bell" role="img" aria-label="啞鈴"><i class="p1"></i><i class="p2"></i><i class="bar"></i><i class="p3"></i><i class="p4"></i></div>
    <h2>健身</h2>
    <p>新手入門原則、一週訓練菜單，還有組間休息計時器。</p>
    <span class="cta">進入健身 →</span>
  </a>
</main>
</body>
</html>
